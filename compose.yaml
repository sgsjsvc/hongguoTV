services:
  local:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${HG_BIND_IP:-127.0.0.1}:${HG_PORT:-8788}:8788"
    environment:
      HG_HOST: 0.0.0.0
      PORT: 8788
      HG_DATA_DIR: /data
    volumes:
      - local-data:/data
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  local-data:
